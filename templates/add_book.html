<!DOCTYPE html>
<html>
<head>
    <title>Add Book</title>
</head>

<body>
    <h1>Add a New Book</h1>

    {% if message %}
        <p>{{ message }}</p>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Add Book</button>
    </form>
</body>
</html>
