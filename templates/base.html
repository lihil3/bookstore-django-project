<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Online Bookstore{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <header>
        <h1>Online Bookstore</h1>

        <nav>
            <a href="{% url 'books.index' %}">Home</a>
            |
            <a href="{% url 'books.list_books' %}">List Books</a>
            |
            <a href="{% url 'books.add_book' %}">Add Book</a>
            |
            <a href="{% url 'books.search' %}">Search</a>
        </nav>
    </header>

    <hr>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
