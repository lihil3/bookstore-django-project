<!DOCTYPE html>
<html>
<head>
    <title>List of Books</title>
</head>

<body>

    <h1>All Books</h1>

    <table border="1">
        <tr>
            <th>Title</th>
            <th>Edition</th>
            <th>Author</th>
            <th>Publication Year</th>
        </tr>

        {% for book in books %}
        <tr>
            <td>{{ book.title }}</td>
            <td>{{ book.edition }}</td>
            <td>{{ book.author.name }}</td>
            <td>{{ book.publication_year }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No books available.</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
